services:
  cafeorigen:
    image: ghcr.io/mb3mx/cafe-origen:1.1.0
    container_name: cafeorigen
    restart: always
    networks:
      - cafeorigen
    expose:
      - 80
    labels:
      - traefik.enable=true
      - traefik.docker.network=cafeorigen
      - traefik.http.routers.cafeorigen.rule=Host(`cafeorigen.gnssys.com`)
      - traefik.http.routers.cafeorigen.tls=true
      - traefik.http.routers.cafeorigen.entrypoints=web,websecure
      - traefik.http.routers.cafeorigen.tls.certresolver=letsencrypt
      - traefik.http.middlewares.cafeorigen.headers.SSLRedirect=true
      - traefik.http.middlewares.cafeorigen.headers.STSSeconds=315360000
      - traefik.http.middlewares.cafeorigen.headers.browserXSSFilter=true
      - traefik.http.middlewares.cafeorigen.headers.contentTypeNosniff=true
      - traefik.http.middlewares.cafeorigen.headers.forceSTSHeader=true
      - traefik.http.middlewares.cafeorigen.headers.SSLHost=cafeorigen.gnssys.com
      - traefik.http.middlewares.cafeorigen.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.cafeorigen.headers.STSPreload=true
      - traefik.http.routers.cafeorigen.middlewares=cafeorigen@docker
      - traefik.http.services.cafeorigen.loadbalancer.server.port=80

networks:
  cafeorigen:
    name: cafeorigen
    driver: bridge
